name: Build and Release KIK-Red

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Install apktool
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
          mkdir -p /home/runner/.local/share/apktool/framework

      - name: Build APK
        run: |
          java -jar apktool.jar b src -o KIK-Red-unsigned.apk --use-aapt1 --frame-path /home/runner/.local/share/apktool/framework
        timeout-minutes: 20

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            KIK-Red-unsigned.apk kikred
          mv KIK-Red-unsigned.apk KIK-Red.apk
        timeout-minutes: 10

      - name: Zipalign
        run: |
          ZALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | head -1)
          $ZALIGN -v 4 KIK-Red.apk KIK-Red-aligned.apk
          mv KIK-Red-aligned.apk KIK-Red.apk

      - name: Generate version info
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIK-Red
          path: KIK-Red.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KIK-Red v${{ steps.version.outputs.version }}
          files: KIK-Red.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
