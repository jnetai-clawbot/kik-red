name: Build and Release KIK-Red

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Build Tools
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || mv NOTICE.txt source.properties lib cmdline-tools/latest/
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "build-tools;34.0.0" "platforms;android-34"
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install apktool
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar

      - name: Build APK
        run: |
          echo "PATH=$PATH"
          which aapt2 || echo "aapt2 not found"
          ls -la $HOME/android-sdk/build-tools/34.0.0/ 2>/dev/null || echo "build-tools dir missing"
          java -jar apktool.jar b src -o KIK-Red-unsigned.apk
        timeout-minutes: 20

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            KIK-Red-unsigned.apk kikred
          mv KIK-Red-unsigned.apk KIK-Red.apk
        timeout-minutes: 10

      - name: Zipalign
        run: |
          $HOME/android-sdk/build-tools/34.0.0/zipalign -v 4 KIK-Red.apk KIK-Red-aligned.apk
          mv KIK-Red-aligned.apk KIK-Red.apk

      - name: Generate version info
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIK-Red
          path: KIK-Red.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KIK-Red v${{ steps.version.outputs.version }}
          files: KIK-Red.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
